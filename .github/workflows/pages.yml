name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site artifact
        run: |
          cp llms.txt site/llms.txt
          cp llms-full.txt site/llms-full.txt
          cp repo-metadata.json site/repo-metadata.json
          cp robots.txt site/robots.txt
          cp sitemap.xml site/sitemap.xml
          mkdir -p site/docs
          cp docs/research-background.md site/docs/research-background.md
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
